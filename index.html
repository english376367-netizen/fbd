<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocabulary Picture Practice</title>
<style>
:root{--blue:#2477e8;--purple:#8454e8;--green:#22a447;--red:#e34255;--ink:#18315d;--bg:#f4f8ff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eff6ff,#fff3fb);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
header{text-align:center;padding:22px 12px 14px;background:linear-gradient(110deg,#6751df,#1789e8);color:white}
header h1{margin:0 0 6px;font-size:clamp(24px,4vw,36px)}header p{margin:0;font-size:15px}
main{max-width:1050px;margin:18px auto;padding:0 12px 32px}
.tabs{display:flex;gap:10px;margin-bottom:16px}.tab{flex:1;border:0;border-radius:14px;padding:14px 8px;font-size:16px;font-weight:700;background:#dce7ff;color:#20457d;cursor:pointer}.tab.active{background:var(--purple);color:white;box-shadow:0 5px 12px #8b6ce655}
.panel{background:white;border-radius:20px;padding:clamp(14px,3vw,25px);box-shadow:0 8px 25px #315b9917;border:1px solid #dce7ff}
.stats{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:700;margin-bottom:12px}.pill{background:#edf3ff;border-radius:99px;padding:8px 13px}
.progress{height:9px;background:#e7ebf4;border-radius:99px;overflow:hidden;margin:12px 0 20px}.bar{height:100%;width:0;background:linear-gradient(90deg,#2fc56a,#168ce8);transition:width .2s}
.prompt{background:#eef5ff;border-radius:14px;padding:14px;text-align:center;font-size:clamp(20px,4vw,27px);font-weight:800;margin-bottom:16px}
.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.choice{border:3px solid #e1e9f7;background:white;border-radius:15px;padding:7px;cursor:pointer;transition:.15s;min-width:0}.choice:hover{transform:translateY(-2px);border-color:#82b5ff}.choice img{width:100%;height:clamp(115px,23vw,220px);object-fit:cover;border-radius:9px;display:block}.choice .speaker{display:block;font-size:23px;margin:5px auto 0;background:#eaf3ff;border-radius:50%;width:42px;height:42px;cursor:pointer;border:0}.choice.correct{border-color:var(--green);background:#eaffef}.choice.wrong{border-color:var(--red);background:#fff0f1}
.feedback{min-height:48px;margin:14px 0;padding:12px;border-radius:12px;font-weight:700}.feedback.good{background:#e4ffeb;color:#13752d}.feedback.bad{background:#fff0f1;color:#b52438}.feedback.neutral{background:#f1f5fb;color:#4a5d7a}
.controls{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;font-size:15px;cursor:pointer;background:#e6edfa;color:#24436e}.btn.primary{background:var(--blue);color:white}.btn.green{background:var(--green);color:white}.btn:disabled{opacity:.45;cursor:not-allowed}
.type-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:center}.bigpic{width:100%;max-height:400px;object-fit:cover;border-radius:16px;border:3px solid #e0eaff}.meaning{background:#fff2bd;border-radius:14px;padding:20px;text-align:center;font-size:clamp(20px,4vw,27px);font-weight:800;margin-bottom:14px;color:#694300}.answerrow{display:flex;gap:8px}.answerrow input{min-width:0;flex:1;border:2px solid #bfd3f6;border-radius:12px;padding:13px;font-size:17px}.answerrow input:focus{outline:3px solid #dbeafe;border-color:var(--blue)}.mini-controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.summary{text-align:center;padding:20px}.summary h2{font-size:28px}.hidden{display:none!important}
@media(max-width:620px){.type-layout{grid-template-columns:1fr}.bigpic{max-height:260px}.options{gap:7px}.choice{padding:4px;border-width:2px}.choice img{height:clamp(100px,32vw,155px)}.choice .speaker{width:36px;height:36px;font-size:20px}.panel{padding:12px}.tabs{gap:6px}.tab{font-size:14px;padding:12px 5px}.btn{padding:11px 13px}}
</style></head><body>

function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function speak(text){
  if(!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)){
    const f=document.getElementById('feedback1'); if(f){f.className='feedback bad';f.textContent='Audio is not supported by this browser. Please open this page in Chrome or Edge.';} return;
  }
  const synth=window.speechSynthesis;
  // Some browsers need voices to finish loading before the first utterance.
  const say=()=>{
    try{
      synth.cancel();
      const u=new SpeechSynthesisUtterance(String(text));
      u.lang='en-GB'; u.rate=0.82; u.pitch=1; u.volume=1;
      const voices=synth.getVoices();
      const voice=voices.find(v=>/^en-GB$/i.test(v.lang)) || voices.find(v=>/^en[-_]/i.test(v.lang));
      if(voice) u.voice=voice;
      u.onerror=()=>{const f=document.getElementById('feedback1');if(f){f.className='feedback bad';f.textContent='Could not play audio. Check your device volume and browser sound settings.';}};
      synth.speak(u);
      // Resume fixes a paused speech engine seen in some Chromium sessions.
      if(synth.paused) synth.resume();
    }catch(e){const f=document.getElementById('feedback1');if(f){f.className='feedback bad';f.textContent='Audio could not start. Try clicking the speaker again.';}}
  };
  if(synth.getVoices().length){say();}else{say();setTimeout(()=>{if(synth.speaking===false && synth.pending===false)say();},250);}
}

function imageHTML(w,idx){return `<img src="${w.img}" alt="Picture option ${idx+1}">`}
function render1(){
 current1=words[order1[pos1]];document.getElementById('q1').textContent=`Question ${pos1+1} of ${words.length}`;document.getElementById('score1').textContent=`Score: ${score1}`;document.getElementById('bar1').style.width=((pos1+1)/words.length*100)+'%';document.getElementById('prompt1').textContent=current1.en;
 let distract=shuffle(words.filter(w=>w!==current1)).slice(0,2);let opts=shuffle([current1,...distract]);let box=document.getElementById('options');box.innerHTML='';
 opts.forEach((w,i)=>{let b=document.createElement('div');b.className='choice';b.innerHTML=imageHTML(w,i)+`<button class="speaker" aria-label="Listen to picture ${i+1}">🔊</button>`;b.querySelector('img').addEventListener('click',()=>{speak(w.en);choose1(b,w)});b.querySelector('button').addEventListener('click',e=>{e.stopPropagation();speak(w.en)});b.addEventListener('keydown',()=>{});if(answered1[pos1]){b.style.pointerEvents='none';if(w.en===current1.en)b.classList.add('correct')}box.appendChild(b)});
 let f=document.getElementById('feedback1');f.className='feedback '+(answered1[pos1]?'good':'neutral');f.textContent=answered1[pos1]?'Correct! Well done!':'Choose the picture that matches the word.';
 document.getElementById('prev1').disabled=pos1===0;document.getElementById('next1').disabled=!answered1[pos1];document.getElementById('next1').textContent=pos1===words.length-1?'Finish ✓':'Next →';
}
function choose1(el,w){if(answered1[pos1])return;let f=document.getElementById('feedback1');if(w.en===current1.en){score1++;answered1[pos1]=true;el.classList.add('correct');f.className='feedback good';f.textContent='Correct! Well done!';document.getElementById('next1').disabled=false;document.getElementById('score1').textContent=`Score: ${score1}`;document.querySelectorAll('#options .choice').forEach(c=>c.style.pointerEvents='none')}else{el.classList.add('wrong');f.className='feedback bad';f.textContent='Not quite. Try another picture!';setTimeout(()=>el.classList.remove('wrong'),650)}}
function move1(d){if(d>0&&pos1===words.length-1){document.getElementById('feedback1').className='feedback good';document.getElementById('feedback1').textContent=`Exercise complete! Your score: ${score1} / ${words.length}`;document.getElementById('next1').disabled=true;return}pos1=Math.max(0,Math.min(words.length-1,pos1+d));render1()}
function render2(){current2=words[order2[pos2]];document.getElementById('q2').textContent=`Question ${pos2+1} of ${words.length}`;document.getElementById('score2').textContent=`Score: ${score2}`;document.getElementById('bar2').style.width=((pos2+1)/words.length*100)+'%';document.getElementById('typePic').src=current2.img;document.getElementById('meaning').textContent=current2.vi;document.getElementById('answer').value='';document.getElementById('answer').disabled=!!done2[pos2];document.getElementById('check2').disabled=!!done2[pos2];document.getElementById('skip2').disabled=!!done2[pos2];let f=document.getElementById('feedback2');f.className='feedback '+(done2[pos2]?(done2[pos2]==='correct'?'good':'neutral'):'neutral');f.textContent=done2[pos2]?(done2[pos2]==='correct'?'Correct! Well done!':`Skipped. The answer is: ${current2.en}`):'Type the English word, then select Check.';document.getElementById('prev2').disabled=pos2===0;document.getElementById('next2').disabled=!done2[pos2];document.getElementById('next2').textContent=pos2===words.length-1?'Finish ✓':'Next →';document.getElementById('summary2').classList.add('hidden');document.getElementById('typeArea').classList.remove('hidden');}
function checkTyped(){if(done2[pos2])return;let val=document.getElementById('answer').value.trim().toLowerCase().replace(/\s+/g,' ');let target=current2.en.toLowerCase();let f=document.getElementById('feedback2');if(val===target){done2[pos2]='correct';score2++;f.className='feedback good';f.textContent='Correct! Well done!';document.getElementById('score2').textContent=`Score: ${score2}`;document.getElementById('answer').disabled=true;document.getElementById('check2').disabled=true;document.getElementById('skip2').disabled=true;document.getElementById('next2').disabled=false}else{f.className='feedback bad';f.textContent='Not quite. Check the spelling and try again.'}}
function skipTyped(){if(done2[pos2])return;done2[pos2]='skip';let f=document.getElementById('feedback2');f.className='feedback neutral';f.textContent=`The answer is: ${current2.en}`;document.getElementById('answer').disabled=true;document.getElementById('check2').disabled=true;document.getElementById('skip2').disabled=true;document.getElementById('next2').disabled=false}
function move2(d){if(d>0&&pos2===words.length-1){document.getElementById('typeArea').classList.add('hidden');document.getElementById('summary2').classList.remove('hidden');document.getElementById('summaryText').textContent=`Your score: ${score2} / ${words.length}.`;return}pos2=Math.max(0,Math.min(words.length-1,pos2+d));render2()}
function restart2(){order2=shuffle(words.map((_,i)=>i));pos2=0;score2=0;done2={};render2()}
document.getElementById('answer').addEventListener('keydown',e=>{if(e.key==='Enter')checkTyped()});
render1();render2();
</script></body></html>
